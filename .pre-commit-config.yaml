repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: sin-claves
        name: sin claves reales
        entry: python3 scripts/check_secretos.py
        language: system
        types: [text]
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy-src
        name: mypy (src)
        entry: mypy src
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy-tests
        name: mypy (tests)
        entry: mypy tests
        language: system
        types: [python]
        pass_filenames: false
