name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Sin claves en el repo
        # xargs en lugar de `$(git ls-files)`: misma semantica y funciona
        # igual en las shells por defecto de los tres sistemas.
        shell: bash
        run: git ls-files -z | xargs -0 python scripts/check_secretos.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (src)
        run: mypy src
      - name: mypy (tests)
        run: mypy tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Linux mantiene la matriz completa (lo verificado en la v1.0);
          # Windows se prueba en las dos puntas para no duplicar minutos
          # sin informacion nueva. macOS no se incluye: los runners
          # macos-* de GitHub no estan disponibles para cuentas free
          # (jobs cancelled sin pasos), y no se finge cobertura.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4
      - name: Sin claves en el repo
        shell: bash
        run: git ls-files -z | xargs -0 python scripts/check_secretos.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Ejecutar tests
        run: pytest --cov=organizador --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Subir coverage.xml (base del badge)
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  badge:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: Generar data.json del escudo
        run: python scripts/badge.py coverage.xml data.json
      - uses: actions/checkout@v4
        with:
          ref: badges
      - name: Publicar escudo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "badge ${GITHUB_SHA::7}" || echo "sin cambios"
          git push

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir sdist y wheel
        run: pipx run build
      - name: Comprobar metadatos
        run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: paquetes
          path: dist/*
