[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador"
dynamic = ["version"]
description = "CLI que organiza archivos descargados por asignatura y tema usando el nombre del archivo."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
organizador = "organizador.cli:main"

[project.optional-dependencies]
pdf = ["pypdf>=4,<8"]
docx = ["python-docx>=1.1,<2"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "pre-commit", 'tomli; python_version < "3.11"', 'organizador[pdf,docx]']

[tool.setuptools.dynamic]
version = { attr = "organizador.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
# el sdist viaja con los guiones de desarrollo (badge, scanner de claves):
# son parte del contrato de calidad del paquete
"share/organizador/scripts" = ["scripts/check_secretos.py", "scripts/badge.py"]

[tool.setuptools.package-data]
organizador = ["reglas.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lento: construye venvs/paquetes reales (no corre con -m 'not lento')",
]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_redundant_casts = true
files = ["src"]

# 3.11 tiene tomllib en stdlib; en 3.10 el dev extra lo instala como tomli,
# y el import conditional del test es intencionado.
[[tool.mypy.overrides]]
module = ["tomllib", "tomli"]
ignore_missing_imports = true

# Los lectores son extras opcionales: el paquete base funciona sin ellos y
# los imports son diferidos (contenido.py); mypy no debe exigirlos instalados.
[[tool.mypy.overrides]]
module = ["pypdf.*", "docx", "docx.*"]
ignore_missing_imports = true

# Las funciones de prueba no devuelven nada: anotar `-> None` en 200
# funciones seria ruido. El chequeo de tipos en tests sigue siendo util
# (dobles, argumentos y retornos de la API publica).
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# `scripts/badge.py` se importa de la raiz del repo (sin paquetes en scripts)
[[tool.mypy.overrides]]
module = "scripts.badge"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
