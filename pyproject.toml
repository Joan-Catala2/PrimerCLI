[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador"
version = "0.1.0"
description = "CLI que organiza archivos descargados por asignatura y tema usando el nombre del archivo."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
organizador = "organizador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
